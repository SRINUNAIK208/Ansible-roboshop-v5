- name: configure catalogue server 
  hosts: frontend 
  become: yes 
  taks:
  - name: disabled latest version of nodejs
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enable old version of nodejs 
    ansible.builtin.command: dnf module enable nodejs:20 -y 

  - name: download the nodejs 
    ansible.builtin.package:
      name: nodejs
      state: present 

  - name: create system user 
    ansible.builtin.user:
      name: roboshop
      system: yes
      shell: /usr/sbin/nologin  # Prevents interactive login for security
      create_home: /app          # System users rarely require a home directory
      state: present

  - name: create home directory 
    ansible.builtin.file:
      path: /app
      state: directory

  - name: download the application code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue-v3.zip 

  - name: unzip the application
    ansible.builtin.unarchive:
      src: /tmp/catalogue-v3.zip
      dest: /app 
      remote_src: yes 
  
  - name: install dependencies
    community.general.npm:
      path: /app

  - name: setup systemctl service
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service 

  - name: daemon reload 
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: enable and start the systemctl 
    ansible.builtin.systemd_service:
      name: catalogue
      state: start
      enabled: true 

  - name: set mongo repo
    ansible.builtin.file: 
      src: mongo.repo 
      dest: /etc/yum.repos.d/mongo.repo 

  - name : install mongodb client 
    ansible.builtin.package:
      name: mongodb-mongosh 
      state: present 
    
  - name: load the mongodb data 
    ansible.builtin.shell: mongosh --host mongodb.srinunayak.online </app/db/master-data.js