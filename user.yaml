- name: configure user server 
  hosts: user 
  become: yes 
  tasks:
  - name: disable latest version and enable the old version of nodejs 
    ansible.builtin.command: dnf module disable nodejs -y
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs 
    ansible.builtin.package:
      name: nodejs
      state: present 

  - name: create system user 
    ansible.builtin.user:
      name: roboshop
      system: yes
      shell: /usr/sbin/nologin  # Prevents interactive login for security
      home: /app          # System users rarely require a home directory
    

  - name: create directory 
    ansible.builtin.file:
      src: /app 
      state: directory 

  - name: download the user code 
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip 
      dest: /tmp/user.zip 

  - name: unzip the user code 
    ansible.builtin.unarchive:
      src: /tmp/user.zip 
      dest: /app 
      remote_src: yes 

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: setup systemctl service
    ansible.builtin.copy:
      src: user.service
      dest: /etc/systemd/system/user.service 

  - name: daemon reload 
    ansible.builtin.service:
      daemon_reload: true

  - name: enable and start the systemctl 
    ansible.builtin.service:
      name: user
      state: started
      enabled: true 

  
      